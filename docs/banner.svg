<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Jayesh Sharma — Full Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .display { font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; letter-spacing: -6px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.5px; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .ticker { animation: slide 22s linear infinite; }
    .orbit { transform-origin: 1110px 70px; animation: spin 28s linear infinite; }
    .stamp { transform-origin: 1110px 160px; animation: wobble 7s ease-in-out infinite; }
    .pulse { transform-origin: 62px 54px; animation: pulse 2s ease-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    .rise { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
    .rise2 { animation: rise 1s .15s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes slide { to { transform: translateX(-680px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes wobble { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-4deg) translateY(-6px); } }
    @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="360" fill="#0b0c0c"/>
  <g class="orbit" fill="none" stroke="#f2f0e8" stroke-opacity=".08">
    <circle cx="1110" cy="70" r="230"/><circle cx="1110" cy="70" r="300" stroke-dasharray="4 10"/>
  </g>

  <!-- eyebrow -->
  <line x1="32" y1="54" x2="50" y2="54" stroke="#9f9f97"/>
  <circle class="pulse" cx="62" cy="54" r="4" fill="#c8ff2e"/>
  <circle cx="62" cy="54" r="4" fill="#c8ff2e"/>
  <text x="76" y="58" class="mono" font-size="12" fill="#9f9f97">AVAILABLE FOR AMBITIOUS BUILDS</text>
  <text x="1248" y="58" class="mono" font-size="12" fill="#77776f" text-anchor="end">INDORE — INDIA</text>

  <!-- name -->
  <text x="28" y="168" class="display rise" font-size="112" fill="#f2f0e8">JAYESH</text>
  <text x="108" y="262" class="display rise2" font-size="112" fill="none" stroke="#f2f0e8" stroke-width="1.6">SHAR<tspan fill="#c8ff2e" stroke="none">M</tspan>A</text>

  <!-- stamp -->
  <g class="stamp">
    <circle cx="1110" cy="160" r="62" fill="none" stroke="#ff4a36"/>
    <text x="1110" y="154" text-anchor="middle" font-size="30" font-weight="900" fill="#ff4a36">構築</text>
    <text x="1110" y="180" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ff4a36">BUILD / LEARN</text>
    <text x="1110" y="194" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#ff4a36">REPEAT</text>
  </g>

  <text x="690" y="230" class="serif" font-size="27" fill="#f2f0e8">Full-stack engineer building</text>
  <text x="690" y="262" class="serif" font-size="27" font-style="italic" fill="#c8ff2e">AI-native systems<tspan fill="#f2f0e8" font-style="normal"> — sketch to prod.</tspan><tspan class="caret" fill="#c8ff2e">▍</tspan></text>

  <!-- ticker -->
  <line x1="0" y1="300" x2="1280" y2="300" stroke="#f2f0e8" stroke-opacity=".16"/>
  <line x1="0" y1="340" x2="1280" y2="340" stroke="#f2f0e8" stroke-opacity=".16"/>
  <g class="ticker" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="900" fill="#f2f0e8" letter-spacing="2">
    <text x="0" y="325">REACT <tspan fill="#c8ff2e">✦</tspan> TYPESCRIPT <tspan fill="#c8ff2e">✦</tspan> FASTAPI <tspan fill="#c8ff2e">✦</tspan> NODE.JS <tspan fill="#c8ff2e">✦</tspan> AWS <tspan fill="#c8ff2e">✦</tspan> CREATIO <tspan fill="#c8ff2e">✦</tspan> AI SYSTEMS <tspan fill="#c8ff2e">✦</tspan></text>
    <text x="680" y="325">REACT <tspan fill="#c8ff2e">✦</tspan> TYPESCRIPT <tspan fill="#c8ff2e">✦</tspan> FASTAPI <tspan fill="#c8ff2e">✦</tspan> NODE.JS <tspan fill="#c8ff2e">✦</tspan> AWS <tspan fill="#c8ff2e">✦</tspan> CREATIO <tspan fill="#c8ff2e">✦</tspan> AI SYSTEMS <tspan fill="#c8ff2e">✦</tspan></text>
    <text x="1360" y="325">REACT <tspan fill="#c8ff2e">✦</tspan> TYPESCRIPT <tspan fill="#c8ff2e">✦</tspan> FASTAPI <tspan fill="#c8ff2e">✦</tspan> NODE.JS <tspan fill="#c8ff2e">✦</tspan> AWS <tspan fill="#c8ff2e">✦</tspan> CREATIO <tspan fill="#c8ff2e">✦</tspan> AI SYSTEMS <tspan fill="#c8ff2e">✦</tspan></text>
  </g>
</svg>
